name: Build and Upload APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. CRITICAL: We must install Flutter FIRST
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      # 2. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 3. Build the Debug APK using Gradle
      # Added --no-daemon to prevent the AWT-EventQueue headless crash!
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      # 4. Upload the APK
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
