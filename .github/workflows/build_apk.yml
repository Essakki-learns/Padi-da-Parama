name: Build and Upload APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (v5 fixes Node 20 warning)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      # THIS IS THE FIX: Move into the ./app folder to find pubspec.yaml
      - name: Install Dependencies
        working-directory: ./app
        run: flutter pub get

      # THIS IS THE FIX: Let Flutter run Gradle for us, not raw Gradle
      - name: Build Debug APK
        working-directory: ./app
        run: flutter build apk --debug --split-per-abi

      # Flutter stores the APK at ./app/build/app/outputs/flutter-apk/
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/app/outputs/flutter-apk/*.apk
